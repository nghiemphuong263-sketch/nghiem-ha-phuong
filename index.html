<script>

const projects=[
{
 slug:"sustainable-finance-smes",
 title:"Sustainable Finance for Vietnamese SMEs",
 category:"SUSTAINABLE FINANCE · MARKET RESEARCH",
 card:"Combining regional benchmarking and stakeholder interviews to identify why green capital remains difficult for Vietnamese SMEs to access.",
 methods:"Desk Research · Interviews · Benchmarking · Gap Analysis",
 image:thumb("1gAKqNPsOwi8k1EDPU_X32NuEvR40A5Yb"),
 summary:"A mixed-method research project examining the gap between Vietnam’s sustainable-finance ambition and the practical ability of SMEs to access green capital.",
 meta:[["Recognition","Winner — Agyra Student Challenge 2025"],["Role","Research Team Leader & Strategy Analyst"],["Focus","SME financing barriers · green investment · policy design"],["Methods","Desk research · interviews · regional benchmarking"]],
 outputs:[{title:"Full research paper",note:"Agyra Student Challenge 2025 · Challenge #1",url:"https://drive.google.com/file/d/1gAKqNPsOwi8k1EDPU_X32NuEvR40A5Yb/view?usp=drive_link"}],
 situation:"Vietnam has increasingly ambitious green-growth and sustainable-finance priorities, yet SMEs still face a very different reality from large corporates. The question was not simply whether green capital existed, but why smaller firms still struggled to identify, qualify for, and use it.",
 approach:[
   ["Regulatory gap","Mapped how taxonomies, reporting expectations and policy coordination affect whether banks and SMEs can identify eligible green activities."],
   ["Financial-market gap","Compared loans, guarantees, blended finance and risk-sharing tools to understand why conventional bank requirements often exclude smaller projects."],
   ["SME capability gap","Used stakeholder interviews to examine ESG awareness, documentation readiness, certification costs and internal capacity."]
 ],
 findings:[
   "The access problem was structural: fragmented rules, conservative lending requirements and weak SME readiness reinforced one another.",
   "Regional benchmarks showed that guarantees, capacity support and phased regulation can reduce both the financial and non-financial cost of participation.",
   "SMEs need project-level support — such as energy-efficiency and rooftop-solar financing pathways — rather than a generic promise of 'green finance'."
 ],
 recommendations:[
   "Build a phased SME-oriented green taxonomy with clearer qualification criteria and simplified reporting.",
   "Expand guarantees, blended-finance mechanisms and bank incentives that reduce perceived risk for smaller green projects.",
   "Pair financing with technical assistance so SMEs can become finance-ready rather than leaving capability building to individual firms.",
   "Develop the market in stages so regulation, financial products and SME capacity mature together."
 ],
 contribution:"I helped structure the access problem, led the desk research and regional comparison, supported the stakeholder interview design and synthesis, and translated evidence into a phased financing roadmap. My focus was on keeping the recommendations implementable for both financial institutions and SMEs rather than treating sustainable finance as a purely policy-level topic.",
 learned:[
   "This project changed how I think about sustainable finance. Availability of capital is only one layer; access depends on whether rules, risk assessment and firm capability fit together. A technically sophisticated financing product can still fail if a small business cannot document its project, absorb certification costs or understand what qualifies.",
   "I also learned to use interviews to challenge desk research rather than simply confirm it. Policy documents suggested that sustainable finance was expanding, while stakeholder conversations exposed the frictions hidden behind those aggregate trends. If I extended the study, I would add more lenders, sector-specific SME cases and actual financing applications to test the roadmap against real approval decisions."
 ]
},
{
 slug:"import-business-process",
 title:"Import Business Process Analysis: Vietnam’s Base Metals",
 category:"LOGISTICS · INTERNATIONAL TRADE · PROCESS ANALYSIS",
 card:"Mapping a high-value import transaction from purchase to payment to identify documentary, customs and infrastructure bottlenecks.",
 methods:"Business Process Analysis · Trade Documentation · Bottleneck Analysis",
 image:importCover,
 summary:"A team-led International Trade Transactions project that mapped the import of base metals into Vietnam and diagnosed why a standard transaction can become a long, document-heavy operational process.",
 meta:[["Course","International Trade Transactions — FTU"],["Role","Team Leader"],["Scope","Buy · Ship · Pay"],["Focus","Trade documents · customs · L/C · logistics bottlenecks"]],
 outputs:[],
 situation:"Vietnam’s industrial growth depends heavily on imported non-ferrous metals, but moving a high-value shipment through purchase, shipping, customs and payment involves far more than physical transport. Our project used a simulated copper transaction to understand where time, documentation and financial risk accumulate across the end-to-end import process.",
 approach:[
   ["Buy","Mapped contracting, quotation, L/C opening and risk allocation before cargo movement."],
   ["Ship","Mapped export documents, inspection, insurance, manifest, customs clearance, D/O, tax settlement and inland delivery."],
   ["Pay","Mapped documentary presentation, bank compliance checks and payment under an irrevocable L/C."]
 ],
 findings:[
   "The process relied on more than twenty distinct document types across commercial, logistics, customs, inspection and banking activities.",
   "Manual cross-checking and physical endorsements created clerical-error risk and contributed to a total process lead time of roughly 43 days.",
   "A small discrepancy between documents such as CoA and B/L could delay bank payment and cargo release, exposing the importer to both storage cost and LME price volatility.",
   "Repeated quality checks and port/infrastructure constraints created operational delay even when international inspection evidence already existed."
 ],
 recommendations:[
   "Standardise key fields across contract, L/C, commercial invoice, packing list, B/L and customs declarations before document submission.",
   "Use realistic lead-time planning and price-risk management when LME-linked settlement windows interact with uncertain clearance time.",
   "Increase digital synchronization across internal compliance systems, customs and trade-finance workflows; use automated document auditing where appropriate.",
   "At policy level, strengthen risk-based inspection, digital C/O verification and recognition of accredited pre-shipment inspection to reduce duplicate controls."
 ],
 contribution:"As team leader, I structured the report around the end-to-end import flow, coordinated the market, contract and process-analysis workstreams, and ensured that operational findings connected back to commercial and financial consequences. The project required integrating Incoterms, documentary trade, customs procedures, port operations and banking controls into one coherent process view.",
 learned:[
   "The main lesson was that logistics performance can be constrained by information flow as much as by physical movement. A vessel or truck may be ready, yet the shipment can still stop because a document field, endorsement, inspection result or bank requirement is misaligned. That made me see trade documentation as part of operations design, not an administrative afterthought.",
   "I also became more attentive to cross-functional trade-offs. Tight controls reduce compliance risk, but duplicated checks create lead time and working-capital costs. A better process does not simply remove controls; it places verification earlier, standardises data and applies stronger checks where risk is highest. If I continued the project, I would validate the 43-day process map with importers, freight forwarders and customs brokers across more ports and product categories."
 ]
},
{
 slug:"ecommerce-operations",
 title:"E-commerce Operations Analytics",
 category:"OPERATIONS ANALYSIS · E-COMMERCE LOGISTICS",
 card:"Diagnosing revenue decline through delivery reliability, seller performance and logistics constraints rather than treating it as a purely commercial problem.",
 methods:"Root-Cause Analysis · Seller Segmentation · Logistics Strategy",
 image:thumb("1XpPyB28lXf4tlHPbHHNnDoTp6-5WNsgd"),
 summary:"A runner-up case project linking commercial performance with logistics reliability, seller quality and customer experience to identify what was preventing post-peak revenue from being retained.",
 meta:[["Competition","Tomorrow Marketers BACC 2025"],["Recognition","Runner-up"],["Role","Operations & Business Analyst"],["Focus","Revenue drivers · delivery · sellers · carrier strategy"]],
 outputs:[{title:"Full competition deck",note:"Final Round — E-commerce Operations Analytics",url:"https://drive.google.com/file/d/1XpPyB28lXf4tlHPbHHNnDoTp6-5WNsgd/view?usp=drive_link"}],

function projectDetail(p){

 return `<section class="project-detail-hero"><div class="shell project-detail-grid"><div>
  <div class="eyebrow">${p.category}</div><h1>${p.title}</h1><p class="lead">${p.summary}</p>

 </div><div class="hero-project-image"><img src="${p.image}" alt="Project preview for ${p.title}"></div></div></section>
 ${p.outputs.length?`<section class="output-strip"><div class="shell"><div class="eyebrow" style="margin-bottom:12px">Project output</div><div class="output-grid">${p.outputs.map(o=>`<a class="output-card" href="${o.url}" target="_blank" rel="noopener"><div><b>${o.title}</b><span>${o.note}</span></div><div class="out-link">Open ↗</div></a>`).join("")}</div></div></section>`:""}
 <section class="case-section white"><div class="shell case-grid"><div><div class="case-index">01 · SITUATION</div><h3>The question behind the project</h3></div><div class="case-copy"><p class="lead">${p.situation}</p></div></div></section>
 <section class="case-section"><div class="shell case-grid"><div><div class="case-index">02 · APPROACH</div><h3>How I structured the problem</h3></div><div class="case-copy"><div class="framework">${p.approach.map(a=>`<div class="frame"><b>${a[0]}</b><p>${a[1]}</p></div>`).join("")}</div></div></div></section>
 <section class="case-section white"><div class="shell case-grid"><div><div class="case-index">03 · FINDINGS</div><h3>What the evidence changed</h3></div><div class="case-copy"><ul>${p.findings.map(x=>`<li>${x}</li>`).join("")}</ul><div class="insight"><b>Analytical principle:</b> The purpose of the analysis was to narrow the decision — not to produce the largest possible number of metrics.</div></div></div></section>
 <section class="case-section"><div class="shell case-grid"><div><div class="case-index">04 · RECOMMENDATIONS</div><h3>From finding to action</h3></div><div class="case-copy"><ul>${p.recommendations.map(x=>`<li>${x}</li>`).join("")}</ul></div></div></section>

 <section class="case-section"><div class="shell case-grid"><div><div class="case-index">06 · REFLECTION</div><h3>What I learned</h3></div><div class="case-copy"><div class="learning"><h3>Beyond the final deliverable</h3>${p.learned.map(x=>`<p>${x}</p>`).join("")}</div><div class="detail-nav"><button data-project="${prev.slug}">← ${prev.title}</button><button data-route="#/projects">All projects</button><button data-project="${next.slug}">${next.title} →</button></div></div></div></section>`;
}
function setActive(section){
 document.querySelectorAll("[data-nav]").forEach(x=>x.classList.toggle("active",x.dataset.nav===section));
}
function bind(){
 document.querySelectorAll("[data-route]").forEach(el=>el.onclick=()=>location.hash=el.dataset.route);
 document.querySelectorAll("[data-project]").forEach(el=>el.onclick=()=>location.hash="#/project/"+el.dataset.project);
}
function render(){
 const hash=location.hash||"#/";
 const app=document.getElementById("app");
 if(hash==="#/"||hash==="#"){app.innerHTML=home();setActive("home")}
 else if(hash==="#/projects"){app.innerHTML=projectsPage();setActive("projects")}
 else if(hash==="#/contact"){app.innerHTML=contactPage();setActive("contact")}
 else if(hash.startsWith("#/project/")){const p=projects.find(x=>x.slug===hash.split("/")[2]);app.innerHTML=p?projectDetail(p):projectsPage();setActive("projects")}
 else{app.innerHTML=home();setActive("home")}
 bind();window.scrollTo({top:0,behavior:"instant"});
}
window.addEventListener("hashchange",render);render();
</script>
