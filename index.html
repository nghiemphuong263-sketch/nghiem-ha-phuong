function projectDetail(p){
 if(p.summaryOnly){return `<section class="page-hero"><div class="shell"><a class="text-link" href="#/projects">← All projects</a><div class="eyebrow" style="margin-top:32px">${p.category}</div><h1>${p.title}</h1><p class="lead">${p.summary}</p><div class="meta-grid">${p.meta.map(m=>`<div class="meta-item"><span>${m[0]}</span><strong>${m[1]}</strong></div>`).join("")}</div></div></section><section class="case-section white"><div class="shell case-grid"><div><div class="case-index">CASE OVERVIEW</div><h3>Scope & objectives</h3></div><div class="case-copy"><p>${p.situation}</p><div class="framework">${p.approach.map(a=>`<div class="frame"><b>${a[0]}</b><p>${a[1]}</p></div>`).join("")}</div>${p.findings.map(f=>`<p>${f}</p>`).join("")}<p class="evidence-note">${p.evidenceNote}</p><a class="btn secondary" href="${p.outputs[0].url}" target="_blank" rel="noopener">View project record ↗</a></div></div></section>`;}

 const pool=researchProjects.includes(p)?researchProjects:projects;
 const idx=pool.findIndex(x=>x.slug===p.slug),prev=pool[(idx-1+pool.length)%pool.length],next=pool[(idx+1)%pool.length];
 return `<section class="project-detail-hero"><div class="shell project-detail-grid"><div>
  <div class="eyebrow">${p.category}</div><h1>${p.title}</h1><p class="lead">${p.summary}</p>
  <div class="meta-grid">${p.meta.map(m=>`<div class="meta-item"><span>${m[0]}</span><strong>${m[1]}</strong></div>`).join("")}</div>
 </div><div class="hero-project-image"><a href="${p.image}" target="_blank" rel="noopener" aria-label="Open full preview for ${p.title}"><img src="${p.image}" alt="Project preview for ${p.title}"></a><a class="image-open-link" href="${p.image}" target="_blank" rel="noopener">Open full-size image ↗</a></div></div></section>
 ${p.outputs.length?`<section class="output-strip"><div class="shell"><div class="eyebrow" style="margin-bottom:12px">Project output</div><div class="output-grid">${p.outputs.map(o=>`<a class="output-card" href="${o.url}" target="_blank" rel="noopener"><div><b>${o.title}</b><span>${o.note}</span></div><div class="out-link">Open ↗</div></a>`).join("")}</div></div></section>`:""}
 <section class="case-section white"><div class="shell case-grid"><div><div class="case-index">01 · SITUATION</div><h3>The question behind the project</h3></div><div class="case-copy"><p class="lead">${p.situation}</p></div></div></section>
 <section class="case-section"><div class="shell case-grid"><div><div class="case-index">02 · APPROACH</div><h3>${p.contribution?"How I structured the problem":"How the team approached it"}</h3></div><div class="case-copy"><div class="framework">${p.approach.map(a=>`<div class="frame"><b>${a[0]}</b><p>${a[1]}</p></div>`).join("")}</div></div></div></section>
 <section class="case-section white"><div class="shell case-grid"><div><div class="case-index">03 · FINDINGS</div><h3>What the evidence changed</h3></div><div class="case-copy"><ul>${p.findings.map(x=>`<li>${x}</li>`).join("")}</ul><div class="insight"><b>Analytical principle:</b> The purpose of the analysis was to narrow the decision — not to produce the largest possible number of metrics.</div></div></div></section>
 <section class="case-section"><div class="shell case-grid"><div><div class="case-index">04 · RECOMMENDATIONS</div><h3>From finding to action</h3></div><div class="case-copy"><ul>${p.recommendations.map(x=>`<li>${x}</li>`).join("")}</ul></div></div></section>
 ${p.contribution?`<section class="case-section white"><div class="shell case-grid"><div><div class="case-index">05 · MY CONTRIBUTION</div><h3>What I was responsible for</h3></div><div class="case-copy"><p>${p.contribution}</p></div></div></section>`:""}
 ${p.learned?.length?`<section class="case-section"><div class="shell case-grid"><div><div class="case-index">06 · REFLECTION</div><h3>What I learned</h3></div><div class="case-copy"><div class="learning"><h3>Beyond the final deliverable</h3>${p.learned.map(x=>`<p>${x}</p>`).join("")}</div></div></div></section>`:""}<section class="case-section"><div class="shell"><p class="evidence-note">${p.evidenceNote||""}</p><div class="detail-nav"><button data-project="${prev.slug}">← ${prev.title}</button><button data-route="${researchProjects.includes(p)?'#/':'#/projects'}">${researchProjects.includes(p)?'Home':'All projects'}</button><button data-project="${next.slug}">${next.title} →</button></div></div></section>`;
}
function setActive(section){
 document.querySelectorAll("[data-nav]").forEach(x=>x.classList.toggle("active",x.dataset.nav===section));
}
function bind(){
 document.querySelectorAll("[data-route]").forEach(el=>el.onclick=()=>location.hash=el.dataset.route);
 document.querySelectorAll("[data-project]").forEach(el=>el.onclick=()=>location.hash=(researchProjects.some(p=>p.slug===el.dataset.project)?"#/research/":"#/project/")+el.dataset.project);
}
function render(){
 const hash=location.hash||"#/";
 const app=document.getElementById("app");
 if(hash==="#/"||hash==="#"){app.innerHTML=home();setActive("home")}
 else if(hash==="#/projects"){app.innerHTML=projectsPage();setActive("projects")}
 else if(hash==="#/blog"){app.innerHTML=blogPage();setActive("blog")}
 else if(hash.startsWith("#/blog/")){const post=blogPosts.find(p=>p.slug===hash.split("/")[2]);app.innerHTML=post?blogPostPage(post):blogPage();setActive("blog")}
 else if(hash.startsWith("#/research/")){const p=researchProjects.find(p=>p.slug===hash.split("/")[2]);app.innerHTML=p?projectDetail(p):home();setActive("home")}
 else if(hash==="#/contact"){app.innerHTML=contactPage();setActive("contact")}
 else if(hash.startsWith("#/project/")){const p=projects.find(x=>x.slug===hash.split("/")[2]);app.innerHTML=p?projectDetail(p):projectsPage();setActive("projects")}
 else{app.innerHTML=home();setActive("home")}
 bind();if(hash==="#/recognition"){document.getElementById("recognition").scrollIntoView({behavior:"instant"})}else{window.scrollTo({top:0,behavior:"instant"})};
}
window.addEventListener("hashchange",render);render();
fetch('blog/posts.json').then(r=>{if(!r.ok)throw new Error('Blog unavailable');return r.json()}).then(posts=>{blogPosts=Array.isArray(posts)?posts.filter(p=>p.published!==false):[];if(location.hash.startsWith('#/blog'))render()}).catch(()=>{});
</script>
