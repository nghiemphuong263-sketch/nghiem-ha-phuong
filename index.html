function setActive(section){
 document.querySelectorAll("[data-nav]").forEach(x=>x.classList.toggle("active",x.dataset.nav===section));
}
function bind(){
 document.querySelectorAll("[data-route]").forEach(el=>el.onclick=()=>location.hash=el.dataset.route);
 document.querySelectorAll("[data-project]").forEach(el=>el.onclick=()=>location.hash=(researchProjects.some(p=>p.slug===el.dataset.project)?"#/research/":"#/project/")+el.dataset.project);
}
function render(){
 const hash=location.hash||"#/";
 const app=document.getElementById("app");
 if(hash==="#/"||hash==="#"){app.innerHTML=home();setActive("home")}
 else if(hash==="#/projects"){app.innerHTML=projectsPage();setActive("projects")}
 else if(hash==="#/blog"){app.innerHTML=blogPage();setActive("blog")}
 else if(hash.startsWith("#/blog/")){const post=blogPosts.find(p=>p.slug===hash.split("/")[2]);app.innerHTML=post?blogPostPage(post):blogPage();setActive("blog")}
 else if(hash.startsWith("#/research/")){const p=researchProjects.find(p=>p.slug===hash.split("/")[2]);app.innerHTML=p?projectDetail(p):home();setActive("home")}
 else if(hash==="#/contact"){app.innerHTML=contactPage();setActive("contact")}
 else if(hash.startsWith("#/project/")){const p=projects.find(x=>x.slug===hash.split("/")[2]);app.innerHTML=p?projectDetail(p):projectsPage();setActive("projects")}
 else{app.innerHTML=home();setActive("home")}
 bind();if(hash==="#/recognition"){document.getElementById("recognition").scrollIntoView({behavior:"instant"})}else{window.scrollTo({top:0,behavior:"instant"})};
}
